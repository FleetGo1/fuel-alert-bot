name: Low-fuel alert

# Each run stays on for ~5.5 hours and checks every 5 minutes inside that time.
# GitHub is asked to start a run every 30 minutes; while one is running, the next one waits
# in line (concurrency) and takes over as soon as the previous one ends. So even when GitHub's
# scheduler is late, there is always a run checking the trucks.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}      # "Run workflow" button

concurrency:
  group: fuel-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # Remembers which trucks were already alerted, so the groups aren't spammed.
      - name: Restore alert memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: fuel-state-${{ github.run_id }}
          restore-keys: fuel-state-

      - name: Check fuel levels every 5 minutes (~5.5 hours)
        timeout-minutes: 340
        env:
          DATA_SOURCE: fleetgo
          # Login is kept only on this temporary GitHub machine for the run, never saved to the repo
          SAVE_SESSION: "1"
          CHECK_EVERY_MINUTES: "5"
          FLEETGO_EMAIL: ${{ secrets.FLEETGO_EMAIL }}
          FLEETGO_PASSWORD: ${{ secrets.FLEETGO_PASSWORD }}
          MOTIVE_API_KEY: ${{ secrets.MOTIVE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_TAGS: ${{ vars.MONITOR_TAGS }}
          FLEETGO_URL: ${{ vars.FLEETGO_URL }}
          FLEETGO_COMPANY_ID: ${{ vars.FLEETGO_COMPANY_ID }}
          IGNORE_UNITS: ${{ vars.IGNORE_UNITS }}
        run: python fuel_alert_bot.py --loop --max-minutes 330

      - name: Save alert memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: fuel-state-${{ github.run_id }}
